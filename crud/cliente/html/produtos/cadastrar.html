<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <script src="../../js/produtos/cadastrar.js" defer></script>
</head>
<body>

    <h1>Cadastro de Produtos</h1>

    <form id="formProduto">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>

        <br><br>

        <label for="preco">Preço:</label>
        <input type="number" id="preco" step="0.01" min="0" required>

        <br><br>

        <label for="fabricante">Fabricante:</label>
        <input type="text" id="fabricante" required>

        <br><br>

        <button type="submit">Cadastrar produto</button>

        <button type="button" id="cancelarEdicao" hidden>Cancelar edição</button>
    </form>

    <h2>Produtos cadastrados</h2>

    <div id="listaProdutos"></div>
</body>
</html>
