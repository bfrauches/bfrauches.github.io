<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cadastro de venda | Loja</title></head>
<body><main class="container"><header class="topo"><div><a class="voltar" href="listar.html">← Voltar para vendas</a><p class="eyebrow">COMERCIAL</p><h1 id="tituloPagina">Nova venda</h1><p class="subtitulo">Escolha o cliente, a data e os produtos.</p></div></header>
<section class="painel"><form id="formulario"><div class="form-grid"><div class="campo"><label for="cliente">Cliente *</label><select id="cliente" required><option value="">Carregando clientes...</option></select></div><div class="campo"><label for="dataVenda">Data da venda *</label><input id="dataVenda" type="date" required></div></div><div class="campo" style="margin-top:20px"><label>Produtos *</label><div id="listaProdutos"><p class="muted">Carregando produtos...</p></div></div><div class="total-box">Total estimado: <span id="totalVenda">R$ 0,00</span></div><p class="muted">O total definitivo é calculado no servidor com os preços salvos no banco de dados.</p><div id="mensagem" class="mensagem" role="alert"></div><div class="form-acoes"><button type="submit" id="botaoSalvar">Cadastrar venda</button><a class="btn btn-secundario" href="listar.html">Cancelar</a></div></form></section></main>
<script src="../../js/api.js"></script><script src="../../js/vendas/cadastrar.js"></script></body></html>
